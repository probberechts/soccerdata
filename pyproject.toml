# ━━━━━━━━━━━━━━━━━━━━━━━━━━ Build System ━━━━━━━━━━━━━━━━━━━━━━━━━━ #

[project]
name = "soccerdata"
dynamic = ["version"]
description = "A collection of scrapers for soccer data from various websites / APIs."
readme = "README.rst"
license = "Apache-2.0"
authors = [
  { name = "Pieter Robberechts", email = "pieter.robberechts@kuleuven.be" }
]
keywords = [
  "football",
  "soccer",
  "soccer analytics",
  "soccer data",
  "web scraping"
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3"
]

# ━━━━━━━━━━━━━━━━━━━━━━ Primary Dependencies ━━━━━━━━━━━━━━━━━━━━━━ #

requires-python = ">=3.11,<3.16"
dependencies = [
  "html5lib>=1.1,<2.0.0",
  "lxml>=5.0.0,<7.0.0",
  "pandas>=3.0.0,<4.0.0",
  "rich>=14.0.0,<16.0.0",
  "seleniumbase>=4.38.2,<6.0.0",
  "tqdm>=4.67.1,<6.0.0",
  "unidecode>=1.4.0,<3.0.0",
  "urllib3<3",
  "wrapper-tls-requests>=1.1.4,<3.0.0"
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ URLs ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ #
[project.urls]
Changelog = "https://github.com/probberechts/soccerdata/releases"
Documentation = "https://soccerdata.readthedocs.io"
Homepage = "https://github.com/probberechts/soccerdata"
Repository = "https://github.com/probberechts/soccerdata"

# ━━━━━━━━━━━━━━━━━━━━━━━ Extra Dependencies ━━━━━━━━━━━━━━━━━━━━━━━ #

[project.optional-dependencies]
socceraction = [
  "socceraction",
]

[dependency-groups]
# Linting and type-checking
lint = [
  "mypy",
  "pre-commit>=4.7.0,<6.0.0",
  "pyright>=1.1.403",
  "ruff",
]

# Testing
test = [
  "dvc[gs]>=3.62.0",
  "pytest>=8.0.0,<10.0.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.14.0,<5.0.0",
  "time-machine>=3.0.0,<4.0.0",
]

# Documentation
docs = [
  "Sphinx>=9.0.0,<10.0.0",
  "furo>=2024.0.0,<2026.0.0",
  "nbsphinx>=0.9.0,<1.0.0",
  "sphinx-autobuild>=2025.0.0,<2026.0.0",
]

# Example notebooks
notebooks = [
  "ipykernel>=7.0.0",
  "matplotlib>=3.11.0",
  "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Hatch ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ #

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "soccerdata/_version.py"

[tool.coverage.paths]
source = ["soccerdata", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["soccerdata", "tests"]

[tool.coverage.report]
show_missing = true
ignore_errors = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ MyPy ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ #

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Pyright ━━━━━━━━━━━━━━━━━━━━━━━━━━━━ #

[tool.pyright]
include = ["soccerdata"]
exclude = [
  "**/__pycache__",
  ".venv",
]
venvPath = "."
venv = ".venv"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━ bumpversion ━━━━━━━━━━━━━━━━━━━━━━━━━━━ #

[tool.pytest.ini_options]
addopts = """
--tb=long
--code-highlight=yes
"""
log_file = "./logs/pytest.log"
testpaths = ["tests"]

[tool.ruff]
src = ["soccerdata", "tests"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = [
  "S",
  "D212",
  "D415",
  "D205",
  "D103",
  "D104",
  "N999",
  "SLF001",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["soccerdata", "tests"]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Pytest ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ #

[tool.uv]
default-groups = [
  "lint",
  "test",
  "docs",
  "notebooks",
]

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Ruff ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ #
